name: Release Windows

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify Windows updater artifacts
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and project
        shell: pwsh
        run: |
          npm run release:check -- --tag "$env:GITHUB_REF_NAME"
          npm run check

      - name: Build Windows NSIS installer
        run: npm run electron:build:win
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Verify Authenticode state
        shell: pwsh
        run: |
          $targets = @(
            (Get-Item 'release\TTool-*-windows-x64-setup.exe'),
            (Get-Item 'release\win-unpacked\TTool.exe')
          )
          $results = @()
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target.FullName
            $results += [PSCustomObject]@{ Name = $target.Name; Status = [string]$signature.Status }
          }
          $results | Format-Table -AutoSize
          $statuses = @($results.Status | Sort-Object -Unique)
          if ($statuses.Count -ne 1 -or $statuses[0] -notin @('Valid', 'NotSigned')) {
            throw "Windows artifacts have an invalid or inconsistent Authenticode state: $($statuses -join ', ')"
          }
          if ($statuses[0] -eq 'NotSigned') {
            Write-Warning 'Publishing unsigned Windows artifacts for controlled internal distribution.'
          }

      - name: Verify updater metadata and hashes
        run: npm run release:check:artifacts

      - name: Upload verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ttool-windows-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Download verified assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ttool-windows-${{ github.ref_name }}
          path: release-assets

      - name: Publish immutable tag release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --title "TTool $GITHUB_REF_NAME" \
            --generate-notes
